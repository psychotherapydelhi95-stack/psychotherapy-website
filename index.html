    <style>
        .yt-nav-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-weight: 600;
            color: #cc0000;
            transition: opacity 0.2s ease;
        }

        .yt-nav-link:hover {
            opacity: 0.8;
        }

        .yt-nav-icon {
            width: 20px;
            height: 20px;
            fill: #ff0000;
            flex-shrink: 0;
        }

        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 2rem;
            margin-top: 2.5rem;
            text-align: left;
        }

        .video-card {
            background: #ffffff;
            border-radius: var(--radius-md, 10px);
            overflow: hidden;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
            display: flex;
            flex-direction: column;
            border: 1px solid rgba(0, 0, 0, 0.06);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .video-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 22px rgba(0, 0, 0, 0.12);
        }

        .video-thumb-link {
            position: relative;
            display: block;
            width: 100%;
            padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
            overflow: hidden;
            background-color: #000;
        }

        .video-thumb-img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .video-thumb-link:hover .video-thumb-img {
            transform: scale(1.04);
        }

        .play-overlay-btn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 58px;
            height: 58px;
            background: rgba(204, 0, 0, 0.88);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s ease, transform 0.2s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            pointer-events: none;
        }

        .video-thumb-link:hover .play-overlay-btn {
            background: #ff0000;
            transform: translate(-50%, -50%) scale(1.1);
        }

        .play-overlay-btn svg {
            width: 24px;
            height: 24px;
            fill: #ffffff;
            margin-left: 3px;
        }

        .video-content {
            padding: 1.25rem 1.5rem;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .video-title {
            font-size: 1.12rem;
            font-weight: 600;
            margin: 0 0 0.5rem 0;
            line-height: 1.4;
        }

        .video-title a {
            color: var(--text-color, #1a1a1a);
            text-decoration: none;
        }

        .video-title a:hover {
            color: #cc0000;
        }

        .video-desc {
            font-size: 0.92rem;
            line-height: 1.55;
            color: var(--text-muted, #555555);
            margin: 0;
            flex-grow: 1;
        }
    </style>
</head>
